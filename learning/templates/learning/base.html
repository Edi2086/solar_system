{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a34">
  <title>{% block title %}Study Hub{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'learning/study-hub.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'learning:home' %}"><span class="brand-mark" aria-hidden="true">✦</span> Study Hub</a>
    <span class="header-note">A little curiosity goes a long way.</span>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer>Study Hub · A space to explore, understand, and grow.</footer>
</body>
</html>
