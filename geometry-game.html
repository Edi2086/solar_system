<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080c20"><title>Geometry Runner</title><style>
*{box-sizing:border-box}body{margin:0;background:#060917;color:#edf5ff;font-family:Arial,sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(ellipse at top,#18234c,transparent 65%)}.app{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:20px}.tag{font-size:10px;letter-spacing:3px;color:#66e2e3}h1{font-size:clamp(24px,4vw,38px);letter-spacing:-1.5px;margin:8px 0;font-weight:800}h1 span{color:#6ce4ed}.stats{display:flex;gap:22px;font-size:10px;letter-spacing:2px;color:#7a89aa}.stats strong{display:block;color:#e3edff;font-size:22px;letter-spacing:0;margin-top:7px}.stage{position:relative;border:1px solid #5b7eb155;border-radius:13px;overflow:hidden;box-shadow:0 25px 100px #0008}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none;background:#101a37}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#060c2077;backdrop-filter:blur(4px);padding:20px}#overlay[hidden]{display:none}.badge{font-size:10px;letter-spacing:3px;color:#7be6e7}h2{font-size:clamp(25px,5vw,52px);letter-spacing:-2px;margin:15px 0}#message{font-size:13px;color:#c0cde4;max-width:360px;line-height:1.7}button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid #7ce9eb66;background:#76e6e9;color:#09212a;padding:13px 25px;font-size:12px;font-weight:700;letter-spacing:1px}button:focus-visible{outline:3px solid white;outline-offset:4px}#start{margin-top:15px}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;color:#8292b1;font-size:11px;line-height:1.7}.actions{display:flex;gap:8px}.actions button{background:#101a31;color:#bdcde7;padding:9px 12px;font-size:10px;border-color:#556c8d66}.key{border:1px solid #64789c66;border-radius:3px;padding:2px 5px;color:#cfdef7}#jump{display:none}@media(max-width:650px){body{padding:12px}.stats{gap:13px;font-size:8px}.stats strong{font-size:18px}header{margin-bottom:12px}.tag{font-size:8px}footer{flex-wrap:wrap}#jump{display:block;background:#76e6e9;color:#09212a}h2{margin:8px 0}#message{font-size:11px;margin:4px 0}#start{padding:10px 20px;margin-top:10px}}
</style></head><body><main class="app"><header><div><div class="tag">ONE CUBE. PERFECT TIMING.</div><h1>Geometry <span>Runner</span></h1></div><div class="stats"><div>PROGRESS<strong id="progress">0%</strong></div><div>BEST<strong id="best">0%</strong></div><div>ATTEMPT<strong id="attempt">1</strong></div></div></header><section class="stage" aria-label="Geometry Runner game"><canvas id="game" width="960" height="540" aria-label="Jump over spikes and blocks. Press Space, click or tap to jump."></canvas><div id="overlay"><div class="badge" id="badge">NEON CIRCUIT / LEVEL 01</div><h2 id="title">Find your rhythm.</h2><p id="message">Jump over spikes and blocks. Reach the finish in one piece. Ready for the run?</p><button id="start">START RUN →</button></div></section><footer><div><span class="key">SPACE</span> / <span class="key">↑</span> / tap to jump &nbsp; · &nbsp; <span class="key">P</span> pause &nbsp; · &nbsp; <span class="key">R</span> restart</div><div class="actions"><button id="jump">JUMP ↑</button><button id="pause">PAUSE</button><button id="sound" aria-pressed="false">SOUND OFF</button></div></footer></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),W=960,H=540,FLOOR=425,SIZE=34,PLAYER_X=175,SPEED=340,GRAVITY=2100,JUMP=-720,FINISH=10800;
const obstacles=[];const patterns=[['spike'],['spike'],['block'],['spike','spike'],['block'],['spike'],['spike','spike'],['block'],['spike','spike','spike'],['block'],['spike','spike'],['spike']];
let placement=900;for(let i=0;i<25;i++){const pattern=patterns[i%patterns.length];pattern.forEach((type,j)=>obstacles.push({x:placement+j*36,w:type==='block'?42:34,h:type==='block'?48:38,type}));placement+=370+(i%4)*38;}
let state='ready',distance=0,y=FLOOR-SIZE,vy=0,rotation=0,attempt=1,best=0,particles=[],last=0,accumulator=0,deadTime=0,jumpQueued=0,audio=null,sound=false;
try{best=Number(localStorage.getItem('geometry-runner-best'))||0}catch{}$('best').textContent=best+'%';
function tone(frequency,duration=.08,type='sine',volume=.04){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.value=frequency;gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
function saveBest(){const value=Math.min(100,Math.floor(distance/FINISH*100));if(value>best){best=value;try{localStorage.setItem('geometry-runner-best',String(best))}catch{}$('best').textContent=best+'%'}}
function show(title,message,button,badge){$('title').textContent=title;$('message').textContent=message;$('start').textContent=button;$('badge').textContent=badge;$('overlay').hidden=false}
function start(){distance=0;y=FLOOR-SIZE;vy=0;rotation=0;particles=[];jumpQueued=0;state='playing';accumulator=0;$('overlay').hidden=true;$('pause').textContent='PAUSE';$('progress').textContent='0%';$('attempt').textContent=attempt;tone(440,.12)}
function requestJump(){if(state==='ready'||state==='dead'||state==='won'){if(state==='dead'&&deadTime<.35)return;start();return}if(state==='playing')jumpQueued=.12}
function togglePause(){if(state==='playing'){state='paused';show('Take a breath.','Your run is paused. Continue when you’re ready.','RESUME →','PAUSED');$('pause').textContent='RESUME'}else if(state==='paused'){state='playing';$('overlay').hidden=true;$('pause').textContent='PAUSE';accumulator=0}}
function crash(){if(state!=='playing')return;state='dead';deadTime=0;saveBest();attempt++;for(let i=0;i<35;i++)particles.push({x:PLAYER_X+17,y:y+17,vx:(Math.random()-.5)*500,vy:(Math.random()-.65)*500,life:.7+Math.random()*.5});tone(95,.25,'sawtooth',.07);show('One more run?','You reached '+Math.floor(distance/FINISH*100)+'%. Watch the obstacle spacing and time your next jump.','TRY AGAIN →','CIRCUIT INTERRUPTED')}
function spikeCollision(o,screenX){const left=PLAYER_X+5,right=PLAYER_X+SIZE-5,top=y+4,bottom=y+SIZE-3;if(right<screenX||left>screenX+o.w||bottom<=FLOOR-o.h)return false;const nearest=Math.max(left,Math.min(right,screenX+o.w/2));const surface=FLOOR-o.h+Math.abs(nearest-(screenX+o.w/2))*o.h/(o.w/2);return bottom>surface&&top<FLOOR}
function update(dt){if(state==='dead')deadTime+=dt;particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=750*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(state!=='playing')return;distance+=SPEED*dt;jumpQueued=Math.max(0,jumpQueued-dt);const grounded=y>=FLOOR-SIZE-.1||obstacles.some(o=>o.type==='block'&&Math.abs(y+SIZE-(FLOOR-o.h))<1&&PLAYER_X+SIZE-4>o.x-distance+PLAYER_X&&PLAYER_X+4<o.x-distance+PLAYER_X+o.w);if(grounded&&jumpQueued>0){vy=JUMP;jumpQueued=0;tone(520,.075,'triangle')}const oldBottom=y+SIZE;vy+=GRAVITY*dt;y+=vy*dt;if(y>=FLOOR-SIZE){y=FLOOR-SIZE;vy=0;rotation=Math.round(rotation/(Math.PI/2))*Math.PI/2}else rotation+=dt*7.8;
for(const o of obstacles){const x=o.x-distance+PLAYER_X;if(x>PLAYER_X+SIZE+10||x+o.w<PLAYER_X-10)continue;if(o.type==='spike'){if(spikeCollision(o,x)){crash();break}}else{const overlap=PLAYER_X+SIZE-4>x&&PLAYER_X+4<x+o.w;if(overlap&&y+SIZE>FLOOR-o.h&&y<FLOOR){if(vy>=0&&oldBottom<=FLOOR-o.h+3){y=FLOOR-o.h-SIZE;vy=0;if(jumpQueued>0){vy=JUMP;jumpQueued=0}}else{crash();break}}}}
$('progress').textContent=Math.min(100,Math.floor(distance/FINISH*100))+'%';if(state==='playing'&&distance>=FINISH){state='won';distance=FINISH;saveBest();attempt++;tone(880,.3,'triangle');show('Circuit complete.','Perfect timing. You made it all the way through Neon Circuit.','PLAY AGAIN →','100% / LEVEL COMPLETE')}}
function draw(){const hue=210+Math.sin(distance*.0003)*20;const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,`hsl(${hue},55%,9%)`);gradient.addColorStop(1,`hsl(${hue+18},60%,21%)`);ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#b7d6ff';for(let i=0;i<65;i++){const sx=((i*157.7-distance*.08)%W+W)%W,sy=35+(i*73.3)%300;ctx.globalAlpha=.15+(i%5)*.07;ctx.fillRect(sx,sy,i%7===0?2:1,i%7===0?2:1)}ctx.globalAlpha=1;
for(let layer=0;layer<2;layer++){ctx.beginPath();ctx.moveTo(0,FLOOR);for(let i=-1;i<12;i++){const x=i*150-(distance*(layer?.17:.09)%150);ctx.lineTo(x,290+layer*45-Math.sin(i*2.8+layer)*45);ctx.lineTo(x+75,210+layer*60-Math.cos(i*1.7)*50)}ctx.lineTo(W+200,FLOOR);ctx.closePath();ctx.fillStyle=layer?'#172448':'#111c36';ctx.fill()}
ctx.strokeStyle='#75c7ed10';ctx.lineWidth=1;const grid=64;for(let x=-(distance*.35%grid);x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let sy=0;sy<H;sy+=grid){ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke()}
ctx.fillStyle='#070e23';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.shadowColor='#5ce4f2';ctx.shadowBlur=13;ctx.fillStyle='#74ecf3';ctx.fillRect(0,FLOOR,W,2);ctx.shadowBlur=0;
for(let x=-(distance%50);x<W;x+=50){ctx.strokeStyle='#5685b329';ctx.beginPath();ctx.moveTo(x,FLOOR+14);ctx.lineTo(x-45,H);ctx.stroke()}
for(const o of obstacles){const x=o.x-distance+PLAYER_X;if(x<-60||x>W+60)continue;ctx.shadowBlur=13;ctx.shadowColor=o.type==='spike'?'#fa66ad':'#9b8bff';ctx.fillStyle=o.type==='spike'?'#172139':'#242848';ctx.strokeStyle=o.type==='spike'?'#ff86bc':'#b2a7ff';ctx.lineWidth=2.5;if(o.type==='spike'){ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x+o.w/2,FLOOR-o.h);ctx.lineTo(x+o.w,FLOOR);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.fillRect(x,FLOOR-o.h,o.w,o.h);ctx.strokeRect(x,FLOOR-o.h,o.w,o.h);ctx.strokeStyle='#8c82bf66';ctx.strokeRect(x+7,FLOOR-o.h+7,o.w-14,o.h-14)}ctx.shadowBlur=0}
const finishX=FINISH-distance+PLAYER_X;if(finishX<W){ctx.fillStyle='#7df7cf';ctx.fillRect(finishX,FLOOR-170,3,170);ctx.font='bold 14px Arial';ctx.fillText('FINISH',finishX-25,FLOOR-185)}
if(state!=='dead'){for(let i=5;i>0;i--){ctx.fillStyle=`rgba(94,235,243,${.035*(6-i)})`;ctx.fillRect(PLAYER_X-i*11,y+4,SIZE-8,SIZE-8)}ctx.save();ctx.translate(PLAYER_X+SIZE/2,y+SIZE/2);ctx.rotate(rotation);ctx.shadowColor='#65eff5';ctx.shadowBlur=20;ctx.fillStyle='#68e7ec';ctx.fillRect(-17,-17,34,34);ctx.shadowBlur=0;ctx.strokeStyle='#e3ffff';ctx.lineWidth=2;ctx.strokeRect(-16,-16,32,32);ctx.fillStyle='#13263e';ctx.fillRect(-10,-9,7,7);ctx.fillRect(3,-9,7,7);ctx.fillRect(-9,5,18,5);ctx.restore()}
particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle='#89f4f9';ctx.fillRect(p.x,p.y,5,5)});ctx.globalAlpha=1;ctx.fillStyle='#ffffff12';ctx.fillRect(0,0,W,4);ctx.fillStyle='#79eef1';ctx.fillRect(0,0,W*Math.min(1,distance/FINISH),4)}
function frame(timestamp){const elapsed=Math.min((timestamp-last)/1000||0,.05);last=timestamp;accumulator+=elapsed;while(accumulator>=1/120){update(1/120);accumulator-=1/120}draw();requestAnimationFrame(frame)}
$('start').onclick=()=>state==='paused'?togglePause():start();$('pause').onclick=togglePause;$('jump').onpointerdown=e=>{e.preventDefault();requestJump()};canvas.addEventListener('pointerdown',e=>{e.preventDefault();requestJump()});$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',sound);if(sound)tone(660,.1)};
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)requestJump()}else if(e.code==='KeyP'&&!e.repeat)togglePause();else if(e.code==='KeyR'&&!e.repeat){if(state==='playing'||state==='paused')attempt++;start()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause()});requestAnimationFrame(frame);
})();
</script></body></html>
